# Spec-2 launch-sandbox contract.
#
# This file is the spec-2 counterpart to the v1 launch-sandbox.toml
# (micro-spec/sandbox/scripts/launch-sandbox.toml) and the
# spec/sandbox/scripts/launch-sandbox.toml drafts. It is the data-driven
# contract consumed by the spec-2 runtime (see sandbox/src/launch-sandbox.ts).
#
# Spec-2 introduces the `[[workspace]]` array as a top-level layout
# declaration. Each `[[workspace]]` block is either:
#   - an orchestrator workspace (default; role omitted or "orchestrator"),
#     which is the one the orchestrator (pi in pane 0) lives in, or
#   - a user workspace (role = "user"), which is reserved for direct
#     human interaction.
#
# See sandbox/CONTEXT.md §1.2 (orchestrator workspace) and §1.4
# (user workspace) for the canonical definitions. ADR 0001 pins the
# one-orchestrator-per-workspace invariant; ADR 0002 pins the
# runtime-only enforcement of the user-workspace reservation.
#
# ADR 0010: Docker containers replaced by macOS Seatbelt (sandbox-exec).
# The [sandbox] block defines the SBPL profile contract. Spec-3 adds
# per-tier profiles without changing this block's shape.

[meta]
name = "launch-sandbox"
version = "0.4.0"
description = "Spec-2 contract: macOS Seatbelt sandbox + orchestrator/user workspace pair."

# F2: herdr auto-allocates exactly one pane at startup (pane 0). Sub-agent
# panes are on demand and do not count toward this count.
[pane_config]
pane_startup_count = 1

[sandbox]
type = "darwin_seatbelt"
profile_dir = "${TMPDIR}/sandbox-profiles"

[sandbox.read_roots]
paths = ["/usr", "/System/Library/Frameworks", "/bin", "/sbin",
         "/private/etc", "/private/var/db/dyld", "/dev"]

[sandbox.write_roots]
paths = ["${WORKSPACE}", "${TMPDIR}"]

[sandbox.cwd_allow_hidden]
basenames = [".venv", ".git", ".node_modules"]

[sandbox.network]
allow = false

[sandbox.env]
passthrough = ["PATH", "HOME", "TMPDIR", "LANG",
               "DEEPSEEK_API_KEY", "AGENT_CAPABILITY"]

# Workspace path on host. Distinct from the per-workspace `[[workspace]]`
# blocks below, which describe herdr-level layout inside the sandbox.
[user]
name = "user"
workdir = "${WORKSPACE}"

# Workspace roles. The user workspace is the only one with role="user";
# the orchestrator workspace (default) lives in the first [[workspace]] block.
[[workspace]]
label = "user"
role = "user"
tab = [{ label = "user", cmd = ["bash"] }]

# Orchestration (F1-F6) — kept minimal in spec-2 because the runtime
# derives everything from the `[[workspace]]` blocks above. See
# fixtures/sandbox-spec/src/{governance,multiplexing,orchestration}.ts
# for the spec-level orchestration types and helpers.
[launch]
mode = "single-sandbox"

[pane_delegation]
mode = "spawn_new_tab"
one_pane_per_agent = true
parent_pane_required = true
tab_per_agent_session = true

[limits]
max_sub_agents_per_orchestrator = 8
max_pane_depth = 3

[sub_orchestrator]
promotion_required = true
max_depth = 3

[governance]
model = "flat"
peer_protocol = "explicit_spawn_signal"
